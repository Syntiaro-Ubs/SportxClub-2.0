<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ===== Primary SEO Meta Tags ===== -->
  <title>SportXClub — Book Sports Venues, Turfs & Grounds Online in India</title>
  <meta name="description" content="Book football turfs, cricket grounds, badminton courts & more near you. Find the best sports venues across India. Instant online booking, best prices, real-time slot availability on SportXClub." />
  <meta name="keywords" content="book sports venue, turf booking, cricket ground booking, football ground near me, badminton court booking, sports booking india, book turf online, futsal court booking, sports venue india" />
  <meta name="author" content="SportXClub" />
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
  <meta name="theme-color" content="#10b981" />
  <link rel="canonical" href="https://www.sportxclub.in/" />

  <!-- ===== Open Graph / Facebook ===== -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.sportxclub.in/" />
  <meta property="og:site_name" content="SportXClub" />
  <meta property="og:locale" content="en_IN" />
  <meta property="og:title" content="SportXClub — Book Sports Venues, Turfs & Grounds Online in India" />
  <meta property="og:description" content="Find and book football turfs, cricket grounds, badminton courts & more near you. Instant booking, real-time availability, best prices guaranteed." />
  <meta property="og:image" content="https://www.sportxclub.in/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="SportXClub — India's Sports Venue Booking Platform" />

  <!-- ===== Twitter Card ===== -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@sportxclub" />
  <meta name="twitter:creator" content="@sportxclub" />
  <meta name="twitter:title" content="SportXClub — Book Sports Venues Online in India" />
  <meta name="twitter:description" content="Book football turfs, cricket grounds & more near you. Instant confirmation, best prices." />
  <meta name="twitter:image" content="https://www.sportxclub.in/og-image.png" />
  <meta name="twitter:image:alt" content="SportXClub Sports Venue Booking" />

  <!-- ===== Favicons ===== -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />

  <!-- ===== JSON-LD Structured Data — Organization ===== -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "SportXClub",
    "url": "https://www.sportxclub.in",
    "logo": "https://www.sportxclub.in/favicon.svg",
    "description": "India's leading online sports venue booking platform. Book football turfs, cricket grounds, badminton courts, and more.",
    "foundingLocation": {
      "@type": "Place",
      "addressCountry": "IN"
    },
    "areaServed": {
      "@type": "Country",
      "name": "India"
    },
    "sameAs": [
      "https://www.instagram.com/sportxclub",
      "https://www.facebook.com/sportxclub"
    ],
    "contactPoint": {
      "@type": "ContactPoint",
      "contactType": "customer service",
      "availableLanguage": ["English", "Hindi"]
    }
  }
  </script>

  <!-- ===== JSON-LD Structured Data — WebSite with SearchAction ===== -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "SportXClub",
    "url": "https://www.sportxclub.in",
    "description": "Book sports venues, turfs, and courts online across India",
    "potentialAction": {
      "@type": "SearchAction",
      "target": {
        "@type": "EntryPoint",
        "urlTemplate": "https://www.sportxclub.in/venues?search={search_term_string}"
      },
      "query-input": "required name=search_term_string"
    }
  }
  </script>

  <!-- ===== LCP Preload for Hero Image ===== -->
  <link rel="preload" as="image" href="/assets/hero/hero-banner.webp" fetchpriority="high" />

</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
